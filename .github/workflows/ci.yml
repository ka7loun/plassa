name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: plassa
          POSTGRES_PASSWORD: plassa
          POSTGRES_DB: plassa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plassa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgres://plassa:plassa@localhost:5432/plassa
      TEST_DATABASE_URL: postgres://plassa:plassa@localhost:5432/plassa_test
      SESSION_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create test database
        run: PGPASSWORD=plassa psql -h localhost -U plassa -d plassa -c "create database plassa_test"
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit + API integration tests (with coverage)
        run: npm run test:coverage
      - name: Migrate and seed the app database
        run: npm run db:setup
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (mobile viewport)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage/
            docs/tests/playwright-report/
            test-results/
          if-no-files-found: ignore
